[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vgna-tournament-bot"
version = "0.1.0"
description = "Standalone Discord tournament registration bot for VGNA"
requires-python = ">=3.11"
dependencies = [
  "discord.py>=2.4,<3",
  "asyncpg>=0.29,<1",
  "python-dotenv>=1.0,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

